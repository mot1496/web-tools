<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>にほん一周 スタンプラリー — 都道府県をおぼえよう</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yusei+Magic&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --umi:#cfe9ee;        /* 海 */
  --umi-fuka:#9ed2de;   /* 深い海 */
  --kon:#173c5c;        /* 紺 */
  --washi:#fffdf4;      /* 和紙 */
  --shima:#fff5dd;      /* 陸地 */
  --yamabuki:#f0a12e;   /* 山吹 */
  --tokiwa:#2f9e72;     /* 常磐 */
  --ake:#e0574a;        /* 朱 */
  --fuji:#8f7cc6;       /* 藤 */
  --kage:rgba(23,60,92,.18);
  --r:18px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","ヒラギノ丸ゴ ProN W4",system-ui,sans-serif;
  font-weight:700;
  color:var(--kon);
  background-color:var(--umi);
  background-image:radial-gradient(circle at 50% 100%,transparent 20%,rgba(255,255,255,.55) 21%,rgba(255,255,255,.55) 24%,transparent 25%,transparent 35%,rgba(255,255,255,.55) 36%,rgba(255,255,255,.55) 39%,transparent 40%,transparent 50%,rgba(255,255,255,.55) 51%,rgba(255,255,255,.55) 54%,transparent 55%);
  background-size:64px 32px;
  overflow:hidden;
  overscroll-behavior:none;
}
#app{height:100dvh;display:flex;flex-direction:column;max-width:820px;margin:0 auto;position:relative}

/* ── ヘッダー ── */
header{
  display:flex;align-items:center;gap:10px;
  padding:10px 14px 8px;flex:none;
}
.brand{font-family:"Yusei Magic",cursive;font-size:17px;letter-spacing:.02em;line-height:1.1;flex:1;min-width:0}
.brand small{display:block;font-family:inherit;font-size:11px;opacity:.6;font-weight:500}
.stamps{
  background:var(--washi);border:2.5px solid var(--kon);border-radius:999px;
  padding:5px 13px;font-size:14px;white-space:nowrap;box-shadow:0 3px 0 var(--kage);
}
.stamps b{font-size:19px;color:var(--yamabuki);font-family:"Yusei Magic",cursive}
.iconbtn{
  width:40px;height:40px;flex:none;border-radius:50%;border:2.5px solid var(--kon);
  background:var(--washi);font-size:17px;cursor:pointer;box-shadow:0 3px 0 var(--kage);
  display:grid;place-items:center;padding:0;color:var(--kon);
}
.iconbtn:active{transform:translateY(3px);box-shadow:none}

/* ── お題バー ── */
#question{
  flex:none;margin:0 14px 8px;background:var(--washi);border:3px solid var(--kon);
  border-radius:var(--r);padding:10px 14px;box-shadow:0 4px 0 var(--kage);
  display:flex;align-items:center;gap:12px;min-height:66px;
}
#qlabel{font-size:12px;opacity:.65;font-weight:500}
#qtext{font-family:"Yusei Magic",cursive;font-size:26px;line-height:1.15}
#qtext .kana{font-size:12px;display:block;opacity:.55;font-family:"Zen Maru Gothic",sans-serif;font-weight:500}
#qmain{flex:1;min-width:0}
#combo{
  font-family:"Yusei Magic",cursive;color:var(--ake);font-size:15px;text-align:center;
  line-height:1.1;opacity:0;transition:opacity .2s;flex:none;
}
#combo.on{opacity:1}
#combo b{display:block;font-size:26px}
#bar{height:8px;background:var(--umi-fuka);border-radius:99px;margin:8px 14px 6px;overflow:hidden;flex:none;border:2px solid var(--kon)}
#bar i{display:block;height:100%;width:0;background:var(--yamabuki);transition:width .35s ease}

/* ── 地図 ── */
#mapbox{
  flex:1;position:relative;margin:0 14px;border:3px solid var(--kon);border-radius:var(--r);
  background:linear-gradient(180deg,#dff2f6,#bde2ea);overflow:hidden;box-shadow:0 4px 0 var(--kage);
  touch-action:none;cursor:grab;min-height:0;
}
#mapbox.grabbing{cursor:grabbing}
#mapInner{width:100%;height:100%;transform-origin:0 0}
svg#japan{width:100%;height:100%;display:block}
.pref{
  fill:var(--shima);stroke:var(--kon);stroke-width:1.1;stroke-linejoin:round;
  cursor:pointer;transition:fill .18s;
}
@media (hover:hover){.pref:hover{fill:#ffe6ac}}
.pref.done{fill:#a8dcc0}
.pref.hint{fill:#ffeec4}
.pref.dim{fill:#eef0ee;opacity:.45}
.pref.target{fill:var(--yamabuki);animation:pulse 1.1s ease-in-out infinite}
.pref.good{fill:var(--tokiwa);stroke-width:2.4;animation:flashok .55s ease}
.pref.bad{fill:var(--ake);stroke-width:2.4;animation:flashng .4s ease}
.pref.target{stroke-width:2.4}
.pref.locked{pointer-events:none}
@keyframes pulse{0%,100%{fill:var(--yamabuki)}50%{fill:#ffe2a3}}
@keyframes flashok{0%{fill:#ffffff}35%{fill:#7fe3b3}100%{fill:var(--tokiwa)}}
@keyframes flashng{0%{fill:#ffffff}35%{fill:#ff9b90}100%{fill:var(--ake)}}
.boundary{stroke:var(--kon);stroke-width:3;stroke-dasharray:7 6;opacity:.5;fill:none}

#zoom{position:absolute;right:9px;bottom:9px;display:flex;flex-direction:column;gap:6px}
#zoom button{width:36px;height:36px;border-radius:11px;border:2.5px solid var(--kon);background:var(--washi);
  font-size:17px;font-weight:900;cursor:pointer;box-shadow:0 3px 0 var(--kage);color:var(--kon);padding:0}
#zoom button:active{transform:translateY(3px);box-shadow:none}

#pin{position:absolute;font-size:30px;pointer-events:none;transform:translate(-50%,-108%);display:none;
  animation:bounce .7s ease-in-out infinite;filter:drop-shadow(0 3px 3px rgba(0,0,0,.3))}
@keyframes bounce{0%,100%{transform:translate(-50%,-108%)}50%{transform:translate(-50%,-135%)}}

/* ── 選択肢 ── */
#choices{flex:none;display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:10px 14px 14px}
#choices.hidden{display:none}
#choices button{
  font-family:inherit;font-weight:700;font-size:18px;padding:14px 6px;border-radius:14px;
  border:3px solid var(--kon);background:var(--washi);color:var(--kon);cursor:pointer;
  box-shadow:0 4px 0 var(--kage);
}
#choices button:active{transform:translateY(4px);box-shadow:none}
#choices button.ok{background:var(--tokiwa);color:#fff}
#choices button.ng{background:var(--ake);color:#fff}
#hintbar{flex:none;padding:0 14px 14px;text-align:center}
#hintbar.hidden{display:none}
#hintbar button{font-family:inherit;font-weight:700;font-size:14px;padding:9px 18px;border-radius:99px;
  border:2.5px solid var(--kon);background:var(--washi);color:var(--kon);cursor:pointer;box-shadow:0 3px 0 var(--kage)}

/* ── オーバーレイ ── */
.sheet{
  position:absolute;inset:0;background:rgba(23,60,92,.45);display:grid;place-items:center;
  padding:16px;z-index:20;overflow:auto;
}
.sheet.hidden{display:none}
.card{
  background:var(--washi);border:4px solid var(--kon);border-radius:24px;padding:20px;
  box-shadow:0 8px 0 rgba(23,60,92,.35);width:100%;max-width:460px;
}
.card h1{font-family:"Yusei Magic",cursive;font-size:27px;margin:0 0 4px;line-height:1.2}
.card p.lead{margin:0 0 16px;font-size:14px;font-weight:500;line-height:1.7}
.sec{font-size:12px;font-weight:500;opacity:.65;margin:14px 0 7px}
.modes{display:grid;gap:9px}
.modebtn{
  display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  font-family:inherit;font-size:17px;font-weight:700;color:var(--kon);
  padding:13px 15px;border-radius:16px;border:3px solid var(--kon);background:#fff;cursor:pointer;
  box-shadow:0 4px 0 var(--kage);
}
.modebtn:active{transform:translateY(4px);box-shadow:none}
.modebtn .em{font-size:26px;flex:none}
.modebtn span small{display:block;font-size:12px;font-weight:500;opacity:.65;margin-top:2px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{
  font-family:inherit;font-size:13px;font-weight:700;color:var(--kon);
  padding:8px 13px;border-radius:99px;border:2.5px solid var(--kon);background:#fff;cursor:pointer;
}
.chip[aria-pressed="true"]{background:var(--kon);color:var(--washi)}
.chip small{font-weight:500;opacity:.7}
.chip[aria-pressed="true"] small{opacity:.85}

/* ── 豆知識カード ── */
#fact{position:absolute;left:14px;right:14px;bottom:14px;z-index:15;
  background:var(--washi);border:3px solid var(--kon);border-radius:var(--r);padding:14px 16px;
  box-shadow:0 6px 0 var(--kage);animation:slideup .3s ease}
#fact.hidden{display:none}
@keyframes slideup{from{transform:translateY(18px);opacity:0}to{transform:none;opacity:1}}
#fact .name{font-family:"Yusei Magic",cursive;font-size:22px;line-height:1.2}
#fact .cap{font-size:12px;font-weight:500;opacity:.65;margin:2px 0 7px}
#fact .tri{font-size:14px;font-weight:500;line-height:1.6;margin-bottom:12px}
#fact button{width:100%;font-family:inherit;font-weight:700;font-size:17px;padding:12px;border-radius:14px;
  border:3px solid var(--kon);background:var(--yamabuki);color:var(--kon);cursor:pointer;box-shadow:0 4px 0 var(--kage)}
#fact button:active{transform:translateY(4px);box-shadow:none}

/* ── スタンプ演出 ── */
#stamp{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:18}
#stamp .mark{
  font-family:"Yusei Magic",cursive;font-size:52px;color:var(--ake);border:6px solid var(--ake);
  border-radius:50%;width:190px;height:190px;display:grid;place-items:center;
  transform:rotate(-14deg) scale(0);opacity:0;background:rgba(255,255,255,.35);
}
#stamp.on .mark{animation:stampin .6s cubic-bezier(.2,1.5,.4,1) forwards}
@keyframes stampin{0%{transform:rotate(-14deg) scale(2.2);opacity:0}
  55%{transform:rotate(-14deg) scale(.92);opacity:1}
  70%{transform:rotate(-14deg) scale(1)}
  100%{transform:rotate(-14deg) scale(1);opacity:0}}
#confetti{position:absolute;inset:0;pointer-events:none;z-index:19}

/* ── 結果 ── */
.score{display:flex;gap:9px;margin:14px 0}
.score div{flex:1;background:#fff;border:3px solid var(--kon);border-radius:14px;padding:10px 6px;text-align:center}
.score b{display:block;font-family:"Yusei Magic",cursive;font-size:28px;color:var(--yamabuki);line-height:1.1}
.score span{font-size:11px;font-weight:500;opacity:.65}
.weak{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.weak i{font-style:normal;font-size:13px;background:#ffe0dc;border:2px solid var(--ake);border-radius:99px;padding:4px 10px}
.actions{display:grid;gap:9px;margin-top:14px}
.actions button{font-family:inherit;font-weight:700;font-size:17px;padding:13px;border-radius:16px;
  border:3px solid var(--kon);background:#fff;color:var(--kon);cursor:pointer;box-shadow:0 4px 0 var(--kage)}
.actions button.primary{background:var(--yamabuki)}
.actions button:active{transform:translateY(4px);box-shadow:none}

:focus-visible{outline:4px solid var(--fuji);outline-offset:2px}
@media (max-width:400px){
  #qtext{font-size:22px}
  #choices button{font-size:16px;padding:12px 4px}
  .card h1{font-size:23px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
}
</style>
</head>

/* ============ 音 ============ */
let soundOn=true, actx=null;
function tone(freq,when,dur,type,vol){
  if(!soundOn)return;
  try{
    actx=actx||new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(),g=actx.createGain();
    o.type=type||"triangle";o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,actx.currentTime+when);
    g.gain.exponentialRampToValueAtTime(vol||0.18,actx.currentTime+when+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,actx.currentTime+when+dur);
    o.connect(g).connect(actx.destination);
    o.start(actx.currentTime+when);o.stop(actx.currentTime+when+dur+0.05);
  }catch(e){}
}
const sndGood=n=>{const b=[784,988,1175,1568];b.forEach((f,i)=>tone(f*(1+Math.min(n,6)*0.03),i*0.07,0.22));};
const sndBad=()=>{tone(233,0,0.16,"square",0.12);tone(175,0.13,0.26,"square",0.12);};
const sndTap=()=>tone(660,0,0.06,"sine",0.09);
const sndFan=()=>[523,659,784,1047,1319].forEach((f,i)=>tone(f,i*0.11,0.4,"triangle",0.16));

/* ============ 地図の操作（ズーム・移動） ============ */
const box=document.getElementById("mapbox"),inner=document.getElementById("mapInner");
let view={s:1,x:0,y:0},drag=null,moved=false;
function apply(){inner.style.transform=`translate(${view.x}px,${view.y}px) scale(${view.s})`;placePin();}
function clamp(){
  const w=box.clientWidth,h=box.clientHeight;
  const minX=Math.min(0,w-w*view.s),minY=Math.min(0,h-h*view.s);
  view.x=Math.max(minX,Math.min(0,view.x));
  view.y=Math.max(minY,Math.min(0,view.y));
}
function zoomAt(f,cx,cy){
  const s2=Math.max(1,Math.min(6,view.s*f));
  const k=s2/view.s;
  view.x=cx-(cx-view.x)*k;view.y=cy-(cy-view.y)*k;view.s=s2;clamp();apply();
}
box.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY,vx:view.x,vy:view.y};moved=false;box.classList.add("grabbing");box.setPointerCapture(e.pointerId);});
box.addEventListener("pointermove",e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
  if(Math.abs(dx)+Math.abs(dy)>7)moved=true;
  if(view.s>1){view.x=drag.vx+dx;view.y=drag.vy+dy;clamp();apply();}
});
["pointerup","pointercancel"].forEach(t=>box.addEventListener(t,()=>{drag=null;box.classList.remove("grabbing");}));
box.addEventListener("wheel",e=>{e.preventDefault();const r=box.getBoundingClientRect();zoomAt(e.deltaY<0?1.15:1/1.15,e.clientX-r.left,e.clientY-r.top);},{passive:false});
zin.onclick=()=>zoomAt(1.4,box.clientWidth/2,box.clientHeight/2);
zout.onclick=()=>zoomAt(1/1.4,box.clientWidth/2,box.clientHeight/2);
zreset.onclick=()=>{view={s:1,x:0,y:0};apply();};
addEventListener("resize",()=>{clamp();apply();});

const pin=document.getElementById("pin");
let pinCode=null;
function placePin(){
  if(pinCode===null){pin.style.display="none";return;}
  const g=document.querySelector(`.pref[data-code="${pinCode}"]`);
  if(!g){pin.style.display="none";return;}
  const r=g.getBoundingClientRect(),b=box.getBoundingClientRect();
  pin.style.display="block";
  pin.style.left=(r.left+r.width/2-b.left)+"px";
  pin.style.top=(r.top+r.height/2-b.top)+"px";
}

/* ============ ゲーム状態 ============ */
const S={mode:"find",region:"all",queue:[],cur:null,tries:0,perfect:0,combo:0,best:0,
  done:new Set(),mastered:new Set(),wrong:new Set(),total:0,locked:false};

const el=id=>document.getElementById(id);
const prefEl=c=>document.querySelector(`.pref[data-code="${c}"]`);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};

function clearMap(){
  document.querySelectorAll(".pref").forEach(g=>{
    g.classList.remove("target","good","bad","hint","dim","locked");
    g.classList.toggle("done",S.mastered.has(+g.dataset.code));
  });
  pinCode=null;placePin();
}
function updateHUD(){
  el("cnt").textContent=S.mastered.size;
  el("bar").firstElementChild.style.width=(S.total?(S.done.size/S.total*100):0)+"%";
  const c=el("combo");
  if(S.combo>=2){c.classList.add("on");c.firstElementChild.textContent=S.combo;}
  else c.classList.remove("on");
}

function startRound(list){
  S.queue=shuffle(list.slice());
  S.total=S.queue.length;S.done=new Set();S.perfect=0;S.combo=0;S.best=0;S.wrong=new Set();
  el("startSheet").classList.add("hidden");
  el("resultSheet").classList.add("hidden");
  view={s:1,x:0,y:0};apply();
  next();
}

function next(){
  clearMap();
  el("fact").classList.add("hidden");
  S.locked=false;S.tries=0;
  if(!S.queue.length){return finish();}
  S.cur=S.queue.shift();
  updateHUD();
  if(S.mode==="find")setupFind();else setupName();
}

function setupFind(){
  el("choices").classList.add("hidden");
  el("hintbar").classList.remove("hidden");
  el("giveup").textContent="ヒントがほしい";
  el("qlabel").textContent="この県は どこ？ 地図をタップしてね";
  el("qtext").innerHTML=`${S.cur.n}<span class="kana">${S.cur.k}</span>`;
}

function setupName(){
  el("hintbar").classList.add("hidden");
  el("qlabel").textContent="光っている県の 名前は？";
  el("qtext").innerHTML=`ここは どこ？<span class="kana">4つからえらんでね</span>`;
  document.querySelectorAll(".pref").forEach(g=>g.classList.add("locked"));
  prefEl(S.cur.c).classList.add("target");
  pinCode=S.cur.c;placePin();
  const same=shuffle(PREF.filter(p=>p.r===S.cur.r&&p.c!==S.cur.c));
  const other=shuffle(PREF.filter(p=>p.r!==S.cur.r));
  const opts=shuffle([S.cur,...same.slice(0,2),...other.slice(0,3)].slice(0,4));
  const box2=el("choices");box2.classList.remove("hidden");box2.innerHTML="";
  opts.forEach(p=>{
    const b=document.createElement("button");
    b.textContent=p.n;b.onclick=()=>answer(p.c,b);
    box2.appendChild(b);
  });
}

function answer(code,btn){
  if(S.locked)return;
  const ok=code===S.cur.c;
  if(ok){
    S.locked=true;
    if(btn)btn.classList.add("ok");
    const g=prefEl(S.cur.c);g.classList.remove("target","dim");g.classList.add("good");
    S.mastered.add(S.cur.c);S.done.add(S.cur.c);
    if(S.tries===0){S.perfect++;S.combo++;S.best=Math.max(S.best,S.combo);}
    else{S.combo=0;}
    updateHUD();
    sndGood(S.combo);
    el("stamp").classList.add("on");setTimeout(()=>el("stamp").classList.remove("on"),700);
    if(S.combo>=3)burst(40);
    setTimeout(showFact,420);
  }else{
    S.tries++;S.combo=0;S.wrong.add(S.cur.c);updateHUD();sndBad();
    if(btn){btn.classList.add("ng");btn.disabled=true;}
    const g=prefEl(code);
    if(g&&S.mode==="find"){g.classList.add("bad");setTimeout(()=>g.classList.remove("bad"),400);}
    box.animate([{transform:"translateX(0)"},{transform:"translateX(-7px)"},{transform:"translateX(7px)"},{transform:"translateX(0)"}],{duration:220});
    if(S.mode==="find"){
      if(S.tries===1){el("qlabel").textContent="おしい！ もういちど さがしてみよう";}
      if(S.tries>=2){showRegionHint();el("qlabel").textContent="この色のエリアの中にあるよ";}
      if(S.tries>=3){el("giveup").textContent="こたえを おしえて";}
    }
  }
}

function showRegionHint(){
  document.querySelectorAll(".pref").forEach(g=>{
    const p=byCode(+g.dataset.code);
    if(p.r!==S.cur.r)g.classList.add("dim");else if(!g.classList.contains("done"))g.classList.add("hint");
  });
}

el("giveup").onclick=()=>{
  if(S.locked)return;
  if(S.tries<2){S.tries=Math.max(S.tries,1);showRegionHint();el("qlabel").textContent="この色のエリアの中にあるよ";S.tries=2;el("giveup").textContent="こたえを おしえて";sndTap();return;}
  S.locked=true;S.tries=99;S.combo=0;S.wrong.add(S.cur.c);
  const g=prefEl(S.cur.c);g.classList.remove("dim","hint");g.classList.add("target");
  pinCode=S.cur.c;placePin();
  S.done.add(S.cur.c);updateHUD();
  setTimeout(showFact,300);
};

function showFact(){
  const p=S.cur;
  el("fname").textContent=p.n;
  el("fcap").textContent=`ふりがな：${p.k} ／ 県庁所在地：${p.cap}`;
  el("ftri").textContent=p.t;
  el("fnext").textContent=S.queue.length?"つぎへ":"けっかを見る";
  el("fact").classList.remove("hidden");
}
el("fnext").onclick=()=>{sndTap();if(S.tries>0)S.queue.push(S.cur);next();};

/* 地図タップ */
box.addEventListener("pointerup",e=>{
  if(moved||S.mode!=="find"||S.locked)return;
  const t=document.elementFromPoint(e.clientX,e.clientY);
  const g=t&&t.closest?t.closest(".pref"):null;
  if(!g)return;
  answer(+g.dataset.code,null);
});

/* ============ 結果 ============ */
function finish(){
  const rate=Math.round(S.perfect/S.total*100);
  el("rtitle").textContent=rate===100?"パーフェクト！":rate>=70?"よくできました！":"おつかれさま！";
  el("rlead").textContent=rate===100?"ぜんぶ一発で正解。もう この地図はきみのものだ。"
    :rate>=70?"あと少しで かんぺき。にがてな県だけ もう一回やってみよう。"
    :"まちがえた県は、いちばん おぼえやすい県。もう一回チャレンジ！";
  el("rperfect").textContent=S.perfect;
  el("rrate").textContent=rate+"%";
  el("rcombo").textContent=S.best;
  const w=[...S.wrong].map(byCode);
  el("weakWrap").style.display=w.length?"":"none";
  el("rweak").innerHTML=w.map(p=>`<i>${p.n}</i>`).join("");
  el("rweakbtn").style.display=w.length?"":"none";
  el("resultSheet").classList.remove("hidden");
  sndFan();burst(140);
  clearMap();
  el("choices").classList.add("hidden");el("hintbar").classList.add("hidden");
}
el("ragain").onclick=()=>startRound(currentList());
el("rweakbtn").onclick=()=>startRound([...S.wrong].map(byCode));
el("rmenu").onclick=()=>{el("resultSheet").classList.add("hidden");openMenu();};

/* ============ メニュー ============ */
function currentList(){return S.region==="all"?PREF:PREF.filter(p=>p.r===S.region);}
function openMenu(){
  clearMap();
  el("choices").classList.add("hidden");el("hintbar").classList.add("hidden");el("fact").classList.add("hidden");
  el("qlabel").textContent="メニュー";
  el("qtext").innerHTML=`あそびかたを えらぼう<span class="kana">スタンプは ${S.mastered.size} こ あつまったよ</span>`;
  el("bar").firstElementChild.style.width=(S.mastered.size/47*100)+"%";
  el("startSheet").classList.remove("hidden");
}
el("menu").onclick=()=>{sndTap();openMenu();};
el("sound").onclick=e=>{soundOn=!soundOn;e.currentTarget.textContent=soundOn?"🔊":"🔇";if(soundOn)sndTap();};

const chips=el("regionChips");
REGIONS.forEach(r=>{
  const n=r.id==="all"?47:PREF.filter(p=>p.r===r.id).length;
  const b=document.createElement("button");
  b.className="chip";b.setAttribute("aria-pressed",r.id===S.region);
  b.innerHTML=`${r.label} <small>${n}</small>`;
  b.onclick=()=>{S.region=r.id;[...chips.children].forEach(c=>c.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true");sndTap();};
  chips.appendChild(b);
});
document.querySelectorAll(".modebtn").forEach(b=>{
  b.onclick=()=>{S.mode=b.dataset.mode;sndTap();startRound(currentList());};
});

/* ============ 紙ふぶき ============ */
const cv=document.getElementById("confetti"),ctx=cv.getContext("2d");
let bits=[],raf=null;
function burst(n){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  cv.width=box.clientWidth;cv.height=box.clientHeight;
  const cols=["#f0a12e","#2f9e72","#e0574a","#8f7cc6","#ffffff"];
  for(let i=0;i<n;i++)bits.push({x:cv.width/2+(Math.random()-.5)*140,y:cv.height/2,
    vx:(Math.random()-.5)*9,vy:-Math.random()*11-3,g:.36,
    w:5+Math.random()*7,h:8+Math.random()*8,a:Math.random()*6,va:(Math.random()-.5)*.3,
    c:cols[i%cols.length],life:80+Math.random()*50});
  if(!raf)raf=requestAnimationFrame(tick);
}
function tick(){
  ctx.clearRect(0,0,cv.width,cv.height);
  bits=bits.filter(b=>b.life-->0&&b.y<cv.height+40);
  bits.forEach(b=>{
    b.x+=b.vx;b.y+=b.vy;b.vy+=b.g;b.a+=b.va;
    ctx.save();ctx.translate(b.x,b.y);ctx.rotate(b.a);
    ctx.fillStyle=b.c;ctx.fillRect(-b.w/2,-b.h/2,b.w,b.h);ctx.restore();
  });
  raf=bits.length?requestAnimationFrame(tick):null;
}

/* ============ 起動 ============ */
apply();openMenu();
</script>
